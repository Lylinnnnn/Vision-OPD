defaults:
  - ppo_trainer
  - user
  - _self_

# =============================================================================
# Res-OPD: Resolution-Aware On-Policy Self-Distillation
#
# Extends Vision-OPD for resolution-based self-distillation.
# All Vision-OPD features are preserved. Additional features:
#   - Online original-ratio image degradation via custom ResOPDDataset
#   - Configurable student_ratio / teacher_ratio views
#   - Configurable teacher mode: ema / frozen / co-evolving
#   - Configurable loss alpha: 0.5=JSD, 1.0=RKL, 0.0=FKL
#
# Teacher mode control (set via CLI overrides):
#   EMA (default):    teacher_model_source=legacy, teacher_regularization=ema
#   Frozen:           teacher_model_source=legacy, teacher_regularization=none
#   Co-evolving:      teacher_model_source=actor,  teacher_regularization=none
# =============================================================================

max_model_len: 9728

actor_rollout_ref:
  actor:
    ppo_mini_batch_size: 32
    policy_loss:
      loss_mode: vopd
    self_distillation:
      max_reprompt_len: 10240
      is_clip: 2.0
      teacher_image_key: hires_images
      teacher_always_on: True
      dont_reprompt_on_self_success: True
      include_environment_feedback: False
      distillation_topk: 100
      alpha: 0.5
      teacher_model_source: legacy
      teacher_regularization: ema
      teacher_update_rate: 0.05
      train_metrics_enabled: True
      train_metrics_verbose: False
      selective_metrics_verbose: False
      trace_enabled: False
      trace_dump_dir: null
      trace_every_n_steps: 5
      trace_max_samples: 4
      trace_topk: null
      trace_entropy: True
      trace_only_first_ppo_epoch: True
      selective_veto_enabled: False
      selective_veto_top_p: 0.10
      selective_veto_min_score: 0.0
      selective_veto_min_tokens: 1
      selective_veto_normalize_by_selected: True
      token_mask_pct: 0.0
      token_mask_metric: loss
      selective_bucket_metrics_enabled: True
      selective_bucket_q_low: 0.70
      selective_bucket_q_high: 0.90
      selective_weight_enabled: False
      # Options: entropy_rkl_bucket, risk_only_mask, random_mask, entropy_mask
      selective_weight_mode: entropy_rkl_bucket
      selective_weight_uncertainty_mode: entropy
      selective_weight_tiered_protect: False
      selective_weight_normalize: True
      selective_weight_risk_top_p: 0.30
      selective_weight_protect_strong_q: 0.25
      selective_weight_entropy_low_q: 0.40
      selective_weight_entropy_high_q: 0.75
      selective_weight_nll_low_q: 0.40
      selective_weight_nll_high_q: 0.80
      selective_weight_loss_low_q: 0.40
      selective_weight_loss_mid_q: 0.50
      selective_weight_loss_high_q: 0.75
      selective_weight_protect_strong: 0.25
      selective_weight_protect_mid: 0.50
      selective_weight_protect_weak: 0.75
      selective_weight_protect: 0.50
      selective_weight_unclear: 0.50
      selective_weight_risk: 1.00
      selective_weight_other: 1.00
    optim:
      lr: 2e-6
  rollout:
    n: 1
    calculate_log_probs: True

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: False
  use_kl_in_reward: False
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

data:
  train_batch_size: 32
  image_key: images
  dataloader_num_workers: 0
  # Custom dataset for online resolution degradation
  custom_cls:
    path: null            # set via CLI: res-opd/res_opd_dataset.py
    name: ResOPDDataset
  # Original-ratio params consumed by ResOPDDataset.
  # *_px fields are kept only for legacy CLI/OSS compatibility and are ignored
  # by original-ratio degradation.
  student_px: 0
  teacher_px: 448
  target_px: 448
  degradation_mode: original
  student_ratio: 1.0
  teacher_ratio: 1.0

reward_model:
  enable: False

trainer:
  val_before_train: False
